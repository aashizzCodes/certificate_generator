<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document ready — Paperform</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="index.html" aria-label="Paperform homepage">
          <span class="brand-mark" aria-hidden="true">P</span>
          <span>paperform</span>
        </a>
        <a class="back-link" href="index.html"
          ><span aria-hidden="true">←</span> All templates</a
        >
      </div>
    </header>

    <main class="success-page">
      <section class="success-card" aria-labelledby="page-title">
        <div class="success-icon" aria-hidden="true">✓</div>
        <p class="eyebrow">GENERATION COMPLETE</p>
        <h1 id="page-title">Your pdf is ready.</h1>
        <p class="success-description">
          Your certificate pages has been prepared.
        </p>
        <div class="generated-file">
          <span class="file-icon" aria-hidden="true">P</span>
          <span class="generated-name">generated_file_name</span>
          <span class="format-tag">PDF</span>
        </div>
        <button class="button button-dark download-button" type="button">
          Download
        </button>
        <a class="home-link" href="index.html">Return to homepage</a>
      </section>
    </main>

    <footer class="site-footer compact-footer">
      <a class="brand footer-brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">P</span>
        <span>paperform</span>
      </a>
      <span class="footer-note">© 2026 Paperform</span>
    </footer>
    <script defer src="script.js"></script>
  </body>
</html>
